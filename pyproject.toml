[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "utm"
version = "0.1.0"
description = "A Universal Turing Machine: formal model, encoding scheme and a 3-tape universal simulator."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rafaello Ferrari", email = "rafaellosferrari@gmail.com" }]
keywords = ["turing-machine", "computability", "theory-of-computation", "automata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
# The runtime has no third-party dependencies: the whole machine is built
# from the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
utm = "utm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utm"]

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["utm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------
# Static typing
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]

# --------------------------------------------------------------------------
# Linting & formatting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "PL",       # pylint
    "N",        # pep8-naming
    "PT",       # flake8-pytest-style
]
ignore = [
    "PLR2004",  # magic values are fine in tests and tiny formal examples
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
